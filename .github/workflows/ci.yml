name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      # Real SOPS integration tests skip when sops is missing; install a pinned,
      # checksum-verified release so they always run in CI.
      - name: Install sops
        env:
          SOPS_VERSION: v3.13.3
          SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
        run: |
          curl -fsSLo sops "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          echo "${SOPS_SHA256}  sops" | sha256sum -c -
          sudo install -m 0755 sops /usr/local/bin/sops
          rm sops
          sops --version

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Test (race detector)
        run: make test-race

      - name: Vulnerability scan
        run: make vulncheck

      - name: Build
        run: make build VERSION=ci COMMIT=${GITHUB_SHA} DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
