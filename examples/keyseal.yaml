version: 1

repository:
  root: .
  encrypted_extension: .enc.yaml

sops:
  binary: sops
  age_binary: age
  age_key_file: ~/.config/sops/age/keys.txt

git:
  auto_commit: false

defaults:
  output_format: dotenv
  output_dir: /run/secrets
  file_mode: "0600"

validation:
  require_values: true
  key_pattern: '^[A-Z0-9_]+$'

# Optional Keyseal binary constraint. Config-backed commands fail closed when
# the installed binary does not satisfy it. Bootstrap tooling can also run
# `keyseal version --check ">=1.1.0"` before loading this file.
# requirements:
#   keyseal: ">=1.1.0"

profiles:
  default:
    renders: []

# Optional access profiles for scoped doctor/verify runs. These are separate
# from render profiles above. Recipients are public age keys only.
# access_profiles:
#   app-server:
#     include:
#       - production/app
#       - production/monitoring
#     exclude:
#       - controller/**
#   controller:
#     include:
#       - controller/**
#     recipients:
#       - age1controllerpublickey

# Optional declarative contracts. doctor checks definitions; verify and
# validate evaluate decrypted values without printing them.
contracts:
  production-app:
    documents:
      - production/platform/app
    required:
      - APP_KEY
      - DB_PASSWORD
    forbidden:
      - TWILIO_TOKEN
    rules:
      - key: DB_PASSWORD
        min_length: 16
      - key: APP_KEY
        non_empty: true
      - when:
          key: FEATURE_BILLING
          equals: "true"
        require:
          - BILLING_WEBHOOK_SECRET
