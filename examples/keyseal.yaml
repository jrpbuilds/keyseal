version: 1

repository:
  root: .
  encrypted_extension: .enc.yaml

sops:
  binary: sops
  age_binary: age
  age_key_file: ~/.config/sops/age/keys.txt

git:
  auto_commit: false

defaults:
  output_format: dotenv
  output_dir: /run/secrets
  file_mode: "0600"

validation:
  require_values: true
  key_pattern: '^[A-Z0-9_]+$'

profiles:
  default:
    renders: []

# Optional declarative contracts. doctor checks definitions; verify and
# validate evaluate decrypted values without printing them.
contracts:
  production-app:
    documents:
      - production/platform/app
    required:
      - APP_KEY
      - DB_PASSWORD
    forbidden:
      - TWILIO_TOKEN
    rules:
      - key: DB_PASSWORD
        min_length: 16
      - key: APP_KEY
        non_empty: true
      - when:
          key: FEATURE_BILLING
          equals: "true"
        require:
          - BILLING_WEBHOOK_SECRET
